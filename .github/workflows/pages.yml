# The eval report used to deploy to https://brennengreen.github.io/speedread/
# and IndexNow-ping that host. Those measurements are upstream's (Brennen Green);
# this fork must not deploy or notify that site.
#
# GitHub Pages is not enabled on netbrah/speedread, so there is no
# https://netbrah.github.io/speedread site to publish to. The job is off.
# To publish the demo there: enable Pages with a GitHub Actions source, then
# remove `if: false` below and restore a push trigger if you want it automatic.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: false
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir _site
          cp demo/index.html _site/index.html
          cp docs/assets/social-preview.jpg _site/og.jpg
          echo "$INDEXNOW_KEY" > "_site/$INDEXNOW_KEY.txt"
        env:
          # IndexNow key for a future netbrah.github.io site. Public by design.
          INDEXNOW_KEY: 8c0025666cbf4cb0185eb736632898a4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Tell search engines the page changed (IndexNow)
        continue-on-error: true
        env:
          INDEXNOW_KEY: 8c0025666cbf4cb0185eb736632898a4
        run: |
          base=https://netbrah.github.io/speedread
          curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"netbrah.github.io\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"$base/$INDEXNOW_KEY.txt\",\"urlList\":[\"$base/\"]}"
